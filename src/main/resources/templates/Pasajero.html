<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Viaje Fácil - Registro y Solicitud de Viaje</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="text-center mb-4">🚖 Registro de Pasajero y Solicitud de Viaje - <b>Viaje Fácil</b></h2>

    <form th:action="@{/pasajero/guardar}" th:object="${pasajero}" method="post" class="needs-validation" novalidate>

        <div class="row g-3">
            <!-- Datos personales -->
            <div class="col-md-6">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-control" th:field="*{nombre}" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Apellido</label>
                <input type="text" class="form-control" th:field="*{apellido}" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Correo Electrónico</label>
                <input type="email" class="form-control" th:field="*{email}" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Teléfono</label>
                <input type="text" class="form-control" th:field="*{telefono}" required>
            </div>

            <div class="col-12">
                <label class="form-label">Dirección</label>
                <input type="text" class="form-control" th:field="*{direccion}" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Fecha de Nacimiento</label>
                <input type="date" class="form-control" th:field="*{fechaNac}" required>
            </div>

            <!-- Solicitud de viaje -->
            <div class="col-12 mt-4">
                <h4 class="text-center text-primary">🧭 Solicitud de Viaje</h4>
            </div>

            <div class="col-12">
                <label class="form-label">Origen</label>
                <input type="text" class="form-control" th:field="*{origen}" placeholder="Ej: Av. San Martín 200" required>
            </div>

            <div class="col-12">
                <label class="form-label">Destino</label>
                <input type="text" class="form-control" th:field="*{destino}" placeholder="Ej: Terminal de Ómnibus" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Tipo de Vehículo</label>
                <select class="form-select" th:field="*{tipoVehiculo}" required>
                    <option value="">Selecciona...</option>
                    <option>Viaje Estándar</option>
                    <option>Viaje Premium</option>
                    <option>Furgoneta (Van)</option>
                </select>
            </div>

            <div class="col-12 text-center mt-4">
                <button class="btn btn-success btn-lg" type="submit">🚗 Solicitar Viaje Fácil</button>
            </div>
        </div>
    </form>
</div>

<script>
(() => {
  'use strict'
  const forms = document.querySelectorAll('.needs-validation')
  Array.from(forms).forEach(form => {
    form.addEventListener('submit', event => {
      if (!form.checkValidity()) {
        event.preventDefault()
        event.stopPropagation()
      }
      form.classList.add('was-validated')
    }, false)
  })
})()
</script>

</body>
</html>
