<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Viaja Fácil - Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f8f9fa;
        }
        header {
            background: linear-gradient(135deg, #007bff, #00b4d8);
            color: white;
            padding: 2rem 0;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        iframe {
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .btn-custom {
            background-color: #198754;
            color: white;
            font-size: 1.2rem;
            padding: 0.75rem 2rem;
            border-radius: 30px;
            transition: 0.3s;
        }
        .btn-custom:hover {
            background-color: #157347;
            transform: scale(1.05);
        }
        footer {
            margin-top: 3rem;
            background: #0d6efd;
            color: white;
            text-align: center;
            padding: 1rem 0;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }
    </style>
</head>

<body>

<!-- ENCABEZADO -->
<header class="text-center">
    <h1 class="fw-bold display-5">🚗 Viaja Fácil</h1>
    <p class="lead">Tu viaje cómodo, rápido y seguro</p>
</header>

<!-- CONTENIDO PRINCIPAL -->
<div class="container mt-5">

    <!-- Botones principales -->
    <div class="text-center mb-4">
        <a th:href="@{/pasajero/nuevo}" class="btn btn-custom me-2">📝 Solicitar Viaje Fácil</a>
        <a th:href="@{/pasajero/lista}" class="btn btn-outline-primary">👥 Ver Pasajeros Registrados</a>
    </div>

    <!-- Iframes de Instagram -->
    <div class="row justify-content-center mb-5">
        <div class="col-md-6 mb-4">
            <div class="ratio ratio-1x1">
                <!-- Reel de Instagram -->
                <iframe 
                    src="https://www.instagram.com/reel/DQZqDvLDvrA/embed"
                    allowtransparency="true" allowfullscreen
                    title="Reel de Instagram"></iframe>
            </div>
        </div>

        <div class="col-md-6 mb-4">
            <div class="ratio ratio-1x1">
                <!-- Imagen/publicación de Instagram -->
                <iframe 
                    src="https://www.instagram.com/p/DP32syXjoQo/embed"
                    allowtransparency="true" allowfullscreen
                    title="Publicación de Instagram"></iframe>
            </div>
        </div>
    </div>

    <!-- Tabla de pasajeros -->
    <div class="card shadow">
        <div class="card-header bg-primary text-white text-center">
            <h4 class="mb-0">Lista de Pasajeros</h4>
        </div>
        <div class="card-body">
            <table class="table table-hover table-bordered align-middle text-center">
                <thead class="table-light">
                    <tr>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>Email</th>
                        <th>Teléfono</th>
                        <th>Dirección</th>
                        <th>Origen</th>
                        <th>Destino</th>
                        <th>Tipo de Vehículo</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${pasajeros}">
                        <td th:text="${p.nombre}"></td>
                        <td th:text="${p.apellido}"></td>
                        <td th:text="${p.email}"></td>
                        <td th:text="${p.telefono}"></td>
                        <td th:text="${p.direccion}"></td>
                        <td th:text="${p.origen}"></td>
                        <td th:text="${p.destino}"></td>
                        <td th:text="${p.tipoVehiculo}"></td>
                    </tr>
                </tbody>
            </table>
            <p class="text-center text-success fw-bold mt-3" th:text="${mensaje}"></p>
        </div>
    </div>

</div>

<!-- PIE DE PÁGINA -->
<footer>
    <p>© 2025 Viaja Fácil | Hecho con ❤️ en Jujuy</p>
</footer>

</body>
</html>
